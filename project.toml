title = "ArmBench MiniLM"
kind = "competition"
status = "submitted"
description = "A reproducible Arm64 benchmark kit that quantizes MiniLM from FP32 to INT8 and measures latency, throughput, model size, and embedding fidelity on native Arm hardware."
limitations = "GitHub-hosted Arm64 runners are virtual machines and do not expose energy telemetry. Results characterize one runner image and workload, not every Arm CPU or production traffic pattern."
