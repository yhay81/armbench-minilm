name: Native Arm64 benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install pinned dependencies
        run: uv sync --frozen

      - name: Check source
        run: |
          uv run ruff check .
          uv run ty check
          uv run pytest

      - name: Quantize and benchmark on native Arm64
        run: >-
          uv run armbench-minilm all
          --work-dir .armbench
          --output-dir results
          --warmups 10
          --block-warmups 3
          --iterations 100
          --measurement-blocks 5
          --sequence-lengths 16 32 64 128
          --batch-sizes 1 8 32
          --threads 4
          --bootstrap-resamples 2000
          --random-seed 20260811
          --profile
          --profile-inferences 20

      - name: Measure native memory-copy bandwidth
        run: >-
          uv run armbench-minilm microbench
          --output results/memory-bandwidth.json
          --sizes-mib 32 256
          --thread-counts 1 4
          --warmups 3
          --iterations 10

      - name: Build operator-scope ceiling analysis
        run: >-
          uv run armbench-minilm ceiling
          --work-dir .armbench
          --evidence-dirs results
          --memory-microbenchmark results/memory-bandwidth.json
          --output-dir results/ceiling

      - name: Publish job summary
        if: always() && hashFiles('results/report.md') != ''
        run: |
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/ceiling/ceiling.md ]]; then
            cat results/ceiling/ceiling.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always() && hashFiles('results/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: arm64-benchmark-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 30
