name: Native Arm64 benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/arm64-benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install pinned dependencies
        run: uv sync --frozen

      - name: Check source
        run: |
          uv run ruff check .
          uv run ty check
          uv run pytest

      - name: Quantize and benchmark on native Arm64
        run: >-
          uv run armbench-minilm all
          --work-dir .armbench
          --output-dir results
          --warmups 10
          --block-warmups 3
          --iterations 100
          --measurement-blocks 5
          --sequence-lengths 16 32 64 128
          --batch-sizes 1 8 32
          --threads 4
          --bootstrap-resamples 2000
          --random-seed 20260811
          --profile
          --profile-inferences 20

      - name: Measure native memory-copy bandwidth
        run: >-
          uv run armbench-minilm microbench
          --output results/memory-bandwidth.json
          --sizes-mib 32 256
          --thread-counts 1 4
          --warmups 3
          --iterations 10

      - name: Measure exact-shape FP32 and QInt8 kernels
        run: >-
          uv run armbench-minilm kernelbench
          --work-dir .armbench
          --output results/kernel-ceiling.json
          --rows 16 32 64 128 256 512 1024 2048 4096
          --threads 4
          --warmups 5
          --block-warmups 3
          --iterations 100
          --measurement-blocks 5
          --random-seed 20260811
          --bootstrap-resamples 2000

      - name: Build operator-scope ceiling analysis
        run: >-
          uv run armbench-minilm ceiling
          --work-dir .armbench
          --evidence-dirs results
          --memory-microbenchmark results/memory-bandwidth.json
          --kernel-microbenchmark results/kernel-ceiling.json
          --output-dir results/ceiling

      - name: Publish job summary
        if: always() && hashFiles('results/report.md') != ''
        run: |
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
          if [[ -f results/ceiling/ceiling.md ]]; then
            cat results/ceiling/ceiling.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always() && hashFiles('results/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: arm64-benchmark-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 30

  bf16-fastmath-experiment:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install pinned dependencies
        run: uv sync --frozen

      - name: Prepare the pinned FP32 and dynamic-QInt8 models
        run: uv run armbench-minilm prepare --work-dir .armbench

      - name: Run the controlled BF16 fast-math experiment
        run: >-
          uv run armbench-minilm bf16-experiment
          --work-dir .armbench
          --output-dir results/experiments/r2-bf16-fastmath
          --warmups 10
          --block-warmups 3
          --iterations 100
          --measurement-blocks 5
          --sequence-lengths 16 32 64 128
          --batch-sizes 1 8 32
          --threads 4
          --bootstrap-resamples 2000
          --random-seed 20260811
          --code-revision "${GITHUB_SHA}"
          --profile
          --profile-inferences 20

      - name: Publish experiment summary
        if: always() && hashFiles('results/experiments/r2-bf16-fastmath/experiment.md') != ''
        run: cat results/experiments/r2-bf16-fastmath/experiment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload BF16 experiment evidence
        if: always() && hashFiles('results/experiments/r2-bf16-fastmath/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: arm64-bf16-experiment-${{ github.run_id }}
          path: results/experiments/r2-bf16-fastmath/
          if-no-files-found: error
          retention-days: 30

  bf16-task-quality-gate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install pinned dependencies
        run: uv sync --frozen

      - name: Prepare the pinned FP32 and dynamic-QInt8 models
        run: uv run armbench-minilm prepare --work-dir .armbench

      - name: Run the revision-pinned downstream quality gate
        run: >-
          uv run armbench-minilm quality-eval
          --work-dir .armbench
          --output-dir results/experiments/r2-bf16-task-quality
          --batch-size 32
          --threads 4
          --code-revision "${GITHUB_SHA}"

      - name: Publish quality summary
        if: always() && hashFiles('results/experiments/r2-bf16-task-quality/quality.md') != ''
        run: cat results/experiments/r2-bf16-task-quality/quality.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload task-quality evidence
        if: always() && hashFiles('results/experiments/r2-bf16-task-quality/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: arm64-bf16-task-quality-${{ github.run_id }}
          path: results/experiments/r2-bf16-task-quality/
          if-no-files-found: error
          retention-days: 30
