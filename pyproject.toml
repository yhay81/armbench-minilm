[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "armbench-minilm"
version = "0.1.0"
description = "Reproducible FP32-to-INT8 MiniLM optimization benchmarks on native Arm64 runners."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Yusuke Hayashi" }]
keywords = ["arm64", "onnxruntime", "quantization", "benchmark", "minilm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "huggingface-hub>=1.2,<2",
  "numpy>=2.1,<3",
  "onnx>=1.18,<2",
  "onnxruntime>=1.22,<2",
  "psutil>=7,<8",
  "pyarrow>=19,<24",
  "transformers>=4.55,<6",
]

[project.scripts]
armbench-minilm = "armbench_minilm.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "ty>=0.0.1a16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/armbench_minilm"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ty.src]
include = ["src", "tests"]
